plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // 🌟 必須有這行，Firebase 才會啟動
    id 'com.google.gms.google-services'
    id 'kotlin-kapt'
}

android {
    namespace 'tw.edu.pu.csim.s1120336.e_fit'
    compileSdk 34 // 建議設為 34 或 35，相容性較好

    defaultConfig {
        applicationId "tw.edu.pu.csim.s1120336.e_fit"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // 如果你有用到 ViewBinding，可以順便開啟
    viewBinding {
        enabled = true
    }
}

dependencies {
    // 🌟 Firebase 物料清單 (BoM) - 自動管理所有 Firebase 版本
    implementation platform('com.google.firebase:firebase-bom:32.7.0')

    // Firebase 功能
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'

    // 🌟 Gemini AI 大腦
    // 🌟 升級版本到 0.12.0，這樣它才認識 Gemini 1.5 Flash
    implementation 'com.google.ai.client.generativeai:generativeai:0.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // UI 與基礎套件
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // 圖片加載 (推薦主要使用 Glide)
    implementation 'com.github.bumptech.glide:glide:4.15.0'
    kapt 'com.github.bumptech.glide:compiler:4.15.0'

    // 網路請求
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

    // 測試相關
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.google.android.gms:play-services-location:21.0.1'

    implementation("com.squareup.okhttp3:okhttp:4.11.0")
}